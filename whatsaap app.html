<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PulseChat — Fast Messaging</title>
  <meta name="theme-color" content="#0b141a" />
  <style>
    :root {
      --bg-main: #0b141a;
      --bg-panel: rgba(17, 27, 33, 0.85);
      --bg-header: rgba(32, 44, 51, 0.9);
      --bg-input: #2a3942;
      --msg-out: #005c4b;
      --msg-in: #202c33;
      --accent: #00a884;
      --accent-hover: #06cf9c;
      --text-main: #e9edef;
      --text-muted: #8696a0;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); height: 100dvh; overflow: hidden; display: flex; justify-content: center; }

    /* Auth Screen */
    #auth-screen {
      width: 100%; max-width: 400px; margin: auto; padding: 30px;
      background: var(--bg-panel); backdrop-filter: blur(16px);
      border: 1px solid var(--border); border-radius: 20px; text-align: center;
    }
    #auth-screen h2 { color: var(--accent); margin-bottom: 8px; font-size: 26px; }
    #auth-screen p { color: var(--text-muted); font-size: 14px; margin-bottom: 22px; }
    .input-group { margin-bottom: 14px; text-align: left; }
    .input-group input {
      width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-input); color: var(--text-main); font-size: 15px; outline: none;
    }
    .input-group input:focus { border-color: var(--accent); }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: var(--accent); color: #0b141a; font-weight: 700; font-size: 15px;
      cursor: pointer; transition: 0.2s; margin-top: 6px;
    }
    .btn:hover { background: var(--accent-hover); }
    .toggle-auth { margin-top: 16px; font-size: 13px; color: var(--text-muted); cursor: pointer; }
    .toggle-auth span { color: var(--accent); font-weight: 600; }

    /* Main App Layout */
    #app-container { display: none; width: 100%; max-width: 1400px; height: 100dvh; background: var(--bg-main); }
    
    /* Sidebar (Contacts) */
    #sidebar {
      width: 360px; border-right: 1px solid var(--border); background: var(--bg-panel);
      display: flex; flex-direction: column; height: 100%;
    }
    .header {
      padding: 14px 18px; background: var(--bg-header); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border);
    }
    .user-badge { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; background: var(--accent);
      color: #0b141a; display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 16px; flex-shrink: 0; position: relative;
    }
    .online-dot {
      width: 10px; height: 10px; background: #00e676; border-radius: 50%;
      position: absolute; bottom: 0; right: 0; border: 2px solid var(--bg-main);
    }
    .search-box { padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .search-box input {
      width: 100%; padding: 9px 14px; border-radius: 8px; border: none;
      background: var(--bg-input); color: var(--text-main); outline: none; font-size: 14px;
    }
    #user-list { flex: 1; overflow-y: auto; }
    .chat-item {
      display: flex; align-items: center; gap: 12px; padding: 13px 16px;
      cursor: pointer; border-bottom: 1px solid var(--border); transition: 0.15s;
    }
    .chat-item:hover, .chat-item.active { background: rgba(255, 255, 255, 0.05); }
    .chat-info { flex: 1; overflow: hidden; }
    .chat-name { font-weight: 600; font-size: 15px; margin-bottom: 3px; }
    .chat-sub { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Chat Window */
    #chat-window { flex: 1; display: flex; flex-direction: column; height: 100%; background: #0b141a; position: relative; }
    #empty-state {
      margin: auto; text-align: center; color: var(--text-muted); padding: 20px;
    }
    #active-chat { display: none; flex-direction: column; height: 100%; }
    #back-btn { display: none; background: none; border: none; color: var(--text-main); font-size: 20px; cursor: pointer; margin-right: 8px; }
    
    #messages {
      flex: 1; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
      background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 0);
      background-size: 24px 24px;
    }
    .msg {
      max-width: 72%; padding: 9px 13px; border-radius: 12px; font-size: 14.5px;
      line-height: 1.4; position: relative; word-wrap: break-word; animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .msg.out { align-self: flex-end; background: var(--msg-out); border-top-right-radius: 2px; }
    .msg.in { align-self: flex-start; background: var(--msg-in); border-top-left-radius: 2px; }
    .msg img { max-width: 240px; border-radius: 8px; display: block; margin-bottom: 5px; }
    .msg-meta { font-size: 10.5px; color: rgba(255,255,255,0.6); text-align: right; margin-top: 3px; }

    /* Input Area */
    .input-bar {
      padding: 10px 14px; background: var(--bg-header); display: flex; align-items: center; gap: 10px;
    }
    .icon-btn {
      background: none; border: none; color: var(--text-muted); font-size: 20px;
      cursor: pointer; padding: 6px; border-radius: 50%; transition: 0.2s;
    }
    .icon-btn:hover { color: var(--accent); background: rgba(255,255,255,0.05); }
    #msg-input {
      flex: 1; padding: 11px 16px; border-radius: 22px; border: none;
      background: var(--bg-input); color: var(--text-main); font-size: 15px; outline: none;
    }
    #send-btn {
      background: var(--accent); color: #0b141a; border: none; width: 42px; height: 42px;
      border-radius: 50%; font-size: 18px; cursor: pointer; font-weight: bold;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      #sidebar { width: 100%; }
      #chat-window { display: none; width: 100%; }
      body.chat-open #sidebar { display: none; }
      body.chat-open #chat-window { display: flex; }
      #back-btn { display: inline-block; }
    }
  </style>
</head>
<body>

  <!-- Login / Register Screen -->
  <div id="auth-screen">
    <h2>PulseChat</h2>
    <p id="auth-subtitle">Fast, lightweight messaging</p>
    <div class="input-group" id="name-group" style="display:none;">
      <input type="text" id="reg-name" placeholder="Apna Naam likho" />
    </div>
    <div class="input-group">
      <input type="email" id="auth-email" placeholder="Email Address" />
    </div>
    <div class="input-group">
      <input type="password" id="auth-pass" placeholder="Password (min 6 chars)" />
    </div>
    <button class="btn" id="auth-btn">Login</button>
    <div class="toggle-auth" id="toggle-auth">Account nahi hai? <span>Naya Account Banao</span></div>
  </div>

  <!-- Main Chat App -->
  <div id="app-container">
    <!-- Left Sidebar -->
    <div id="sidebar">
      <div class="header">
        <div class="user-badge">
          <div class="avatar" id="my-avatar">U</div>
          <span id="my-name">User</span>
        </div>
        <button class="icon-btn" id="logout-btn" title="Logout">⏻</button>
      </div>
      <div class="search-box">
        <input type="text" id="search-user" placeholder="Search contacts..." />
      </div>
      <div id="user-list"></div>
    </div>

    <!-- Right Chat Area -->
    <div id="chat-window">
      <div id="empty-state">
        <h3>PulseChat Web & Mobile</h3>
        <p style="margin-top:8px; font-size:14px;">Baat karne ke liye left side se kisi contact par click karo.</p>
      </div>

      <div id="active-chat">
        <div class="header">
          <div class="user-badge">
            <button id="back-btn">←</button>
            <div class="avatar" id="chat-avatar">A</div>
            <div>
              <div id="chat-name" style="font-size:15px;">Contact</div>
              <div id="chat-status" style="font-size:11.5px; color:var(--accent);">Online</div>
            </div>
          </div>
        </div>

        <div id="messages"></div>

        <div class="input-bar">
          <input type="file" id="img-input" accept="image/*" style="display:none;" />
          <button class="icon-btn" id="attach-btn" title="Send Photo">📷</button>
          <input type="text" id="msg-input" placeholder="Message likho..." autocomplete="off" />
          <button id="send-btn">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 👇 YAHAN APNA FIREBASE CONFIG PASTE KARO 👇
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isSignup = false;
    let currentUser = null;
    let selectedUser = null;
    let unsubscribeMsgs = null;

    // Toggle Login / Signup
    const authBtn = document.getElementById("auth-btn");
    const toggleAuth = document.getElementById("toggle-auth");
    const nameGroup = document.getElementById("name-group");

    toggleAuth.onclick = () => {
      isSignup = !isSignup;
      nameGroup.style.display = isSignup ? "block" : "none";
      authBtn.textContent = isSignup ? "Sign Up" : "Login";
      toggleAuth.innerHTML = isSignup ? 'Pehle se account hai? <span>Login Karo</span>' : 'Account nahi hai? <span>Naya Account Banao</span>';
    };

    // Auth Action
    authBtn.onclick = async () => {
      const email = document.getElementById("auth-email").value.trim();
      const pass = document.getElementById("auth-pass").value.trim();
      const name = document.getElementById("reg-name").value.trim();

      if (!email || !pass) return alert("Email aur Password daalo!");
      try {
        if (isSignup) {
          if (!name) return alert("Apna naam likho!");
          const cred = await createUserWithEmailAndPassword(auth, email, pass);
          await setDoc(doc(db, "users", cred.user.uid), {
            uid: cred.user.uid, name, email, online: true, lastSeen: serverTimestamp()
          });
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
        }
      } catch (e) {
        alert("Error: " + e.message);
      }
    };

    // Auth State Listener
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById("auth-screen").style.display = "none";
        document.getElementById("app-container").style.display = "flex";
        
        const snap = await getDoc(doc(db, "users", user.uid));
        const myData = snap.exists() ? snap.data() : { name: user.email.split("@")[0] };
        document.getElementById("my-name").textContent = myData.name;
        document.getElementById("my-avatar").textContent = myData.name[0].toUpperCase();
        
        await setDoc(doc(db, "users", user.uid), { online: true }, { merge: true });
        loadUsers();
      } else {
        document.getElementById("auth-screen").style.display = "block";
        document.getElementById("app-container").style.display = "none";
      }
    });

    document.getElementById("logout-btn").onclick = async () => {
      if (currentUser) await setDoc(doc(db, "users", currentUser.uid), { online: false }, { merge: true });
      signOut(auth);
    };

    // Load Contacts
    function loadUsers() {
      onSnapshot(collection(db, "users"), (snapshot) => {
        const list = document.getElementById("user-list");
        const filter = document.getElementById("search-user").value.toLowerCase();
        list.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const u = docSnap.data();
          if (u.uid === currentUser.uid) return;
          if (filter && !u.name.toLowerCase().includes(filter)) return;

          const div = document.createElement("div");
          div.className = "chat-item" + (selectedUser?.uid === u.uid ? " active" : "");
          div.innerHTML = `
            <div class="avatar">${u.name[0].toUpperCase()}${u.online ? '<div class="online-dot"></div>' : ''}</div>
            <div class="chat-info">
              <div class="chat-name">${u.name}</div>
              <div class="chat-sub">${u.online ? 'Online' : 'Tap to chat'}</div>
            </div>
          `;
          div.onclick = () => openChat(u);
          list.appendChild(div);
        });
      });
    }
    document.getElementById("search-user").oninput = loadUsers;

    // Open 1-to-1 Chat
    function openChat(user) {
      selectedUser = user;
      document.body.classList.add("chat-open");
      document.getElementById("empty-state").style.display = "none";
      document.getElementById("active-chat").style.display = "flex";
      document.getElementById("chat-name").textContent = user.name;
      document.getElementById("chat-avatar").textContent = user.name[0].toUpperCase();
      document.getElementById("chat-status").textContent = user.online ? "Online" : "Offline";

      const chatId = [currentUser.uid, user.uid].sort().join("_");
      if (unsubscribeMsgs) unsubscribeMsgs();

      const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"));
      unsubscribeMsgs = onSnapshot(q, (snap) => {
        const msgBox = document.getElementById("messages");
        msgBox.innerHTML = "";
        snap.forEach((mDoc) => {
          const m = mDoc.data();
          const isMe = m.senderId === currentUser.uid;
          const time = m.createdAt ? new Date(m.createdAt.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "...";
          const div = document.createElement("div");
          div.className = "msg " + (isMe ? "out" : "in");
          div.innerHTML = `
            ${m.image ? `<img src="${m.image}" />` : ""}
            ${m.text ? `<div>${m.text}</div>` : ""}
            <div class="msg-meta">${time} ${isMe ? "✓✓" : ""}</div>
          `;
          msgBox.appendChild(div);
        });
        msgBox.scrollTop = msgBox.scrollHeight;
      });
    }

    document.getElementById("back-btn").onclick = () => {
      document.body.classList.remove("chat-open");
      selectedUser = null;
    };

    // Send Text Message
    async function sendMessage(text = "", image = "") {
      if (!selectedUser || (!text && !image)) return;
      const chatId = [currentUser.uid, selectedUser.uid].sort().join("_");
      await addDoc(collection(db, "chats", chatId, "messages"), {
        senderId: currentUser.uid,
        text,
        image,
        createdAt: serverTimestamp()
      });
    }

    document.getElementById("send-btn").onclick = () => {
      const inp = document.getElementById("msg-input");
      sendMessage(inp.value.trim());
      inp.value = "";
    };
    document.getElementById("msg-input").onkeypress = (e) => {
      if (e.key === "Enter") document.getElementById("send-btn").click();
    };

    // Fast Compressed Image Sharing
    document.getElementById("attach-btn").onclick = () => document.getElementById("img-input").click();
    document.getElementById("img-input").onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const scale = Math.min(600 / img.width, 1);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          sendMessage("", canvas.toDataURL("image/jpeg", 0.7));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
  </script>
</body>
</html>
